<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nameplate Research</title>
<meta name="description" content="Project-level intelligence on U.S. power generation.">
<link rel="canonical" href="https://nameplateresearch.com/">
<meta property="og:title" content="Nameplate Research">
<meta property="og:description" content="Project-level intelligence on U.S. power generation.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://nameplateresearch.com/">
<meta property="og:image" content="https://nameplateresearch.com/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://nameplateresearch.com/og-image.png">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root { --ink:#1a1d21; --muted:#5d6570; --line:#e4e7eb; --bg:#fbfbfa; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { overflow-x:hidden; }
  body {
    font-family: Georgia, 'Times New Roman', serif;
    background:var(--bg); color:var(--ink);
    min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;
  }
  main { flex:1; display:flex; align-items:center; justify-content:center; padding:2rem; }
  .wrap { max-width:34rem; text-align:center; }
  .wordmark {
    font-size:0.78rem; letter-spacing:0.32em; text-transform:uppercase;
    color:var(--muted); font-family:-apple-system, 'Helvetica Neue', Arial, sans-serif;
    margin-bottom:2.5rem;
  }
  h1 { font-size:clamp(2.2rem, 8vw, 4rem); font-weight:400; letter-spacing:-0.01em; margin-bottom:1.4rem; }
  .rule { width:3rem; height:1px; background:var(--ink); margin:0 auto 1.6rem; }
  p.lede { font-size:1.06rem; line-height:1.75; color:var(--muted); }
  p.lede + p.lede { margin-top:1.2rem; }
  p.lede a { color:inherit; text-decoration:none; border-bottom:1px solid var(--line); white-space:nowrap; }
  p.lede a:hover { color:var(--ink); border-color:var(--ink); }
  footer {
    padding:1.6rem 2rem 2rem; text-align:center;
    font-family:-apple-system, 'Helvetica Neue', Arial, sans-serif;
    font-size:0.78rem; color:var(--muted); letter-spacing:0.04em;
  }
  footer a { color:var(--muted); text-decoration:none; border-bottom:1px solid var(--line); }
  footer a:hover { color:var(--ink); border-color:var(--ink); }
  footer .sep { margin:0 0.6rem; color:var(--line); }
  @media (max-width:480px){
    main { padding:1.5rem 24px; }
    p.lede { font-size:1.07rem; }
  }
</style>
</head>
<body>
<main>
  <div class="wrap">
    <div class="wordmark">Est. 2026</div>
    <h1>Nameplate Research</h1>
    <div class="rule"></div>
    <p class="lede">Project-level intelligence on U.S. power generation. We track new-build and expansion projects from first filing to commercial operation.</p>
    <p class="lede">Ask for a sample on any project: <a href="mailto:info@nameplateresearch.com">info@nameplateresearch.com</a></p>
  </div>
</main>
<footer>
  <a href="mailto:info@nameplateresearch.com">info@nameplateresearch.com</a>
  <span class="sep">&middot;</span>
  &copy; 2026 Nameplate Research
</footer>
</body>
</html>
